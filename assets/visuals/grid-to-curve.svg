<svg viewBox="0 0 760 520" role="img" aria-labelledby="visual-title visual-description" xmlns="http://www.w3.org/2000/svg">
      <title id="visual-title">From grid cells to policy</title>
      <desc id="visual-description">A rigid teal measurement grid feeds angular connections, which gradually transform into violet and orange flowing curves, illustrating how quantitative models meet normative choices.</desc>

  <style>
    .visual-panel { fill:url(#panelGradient); stroke:rgba(92,220,210,.17); stroke-width:1.2; }
    .grid-line { stroke:rgba(120,189,198,.18); stroke-width:1; fill:none; }
    .grid-node { fill:rgba(89,226,213,.5); }
    .angular-path { fill:none; stroke:url(#logicGradient); stroke-width:3.2; stroke-linejoin:round; stroke-linecap:round; }
    .curve-path { fill:none; stroke:url(#flowGradient); stroke-width:4; stroke-linecap:round; }
    .flow-halo { fill:none; stroke:rgba(255,148,100,.08); stroke-width:26; stroke-linecap:round; }
    .transition-path { fill:none; stroke:url(#logicHumanGradient); stroke-width:2; stroke-dasharray:5 8; opacity:.76; animation:trace-between 12s linear infinite; }
    @keyframes trace-between { to { stroke-dashoffset:-130; } }
    .visual-node { stroke:none; }
    .visual-node.logic { fill:#5de3d7; }
    .visual-node.shift { fill:#8b7dff; }
    .visual-node.human { fill:#ff9464; }
    .data-label { fill:#93aab3; font:500 13px monospace; letter-spacing:.075em; }
    @media (prefers-reduced-motion: reduce) { .transition-path { animation:none; } }
  </style>
      <defs>
        <linearGradient id="panelGradient" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#0d1a24"/>
          <stop offset="100%" stop-color="#09131c"/>
        </linearGradient>
        <linearGradient id="logicGradient" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#59e2d5"/>
          <stop offset="100%" stop-color="#8b7dff"/>
        </linearGradient>
        <linearGradient id="flowGradient" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#8b7dff"/>
          <stop offset="100%" stop-color="#ff9464"/>
        </linearGradient>
        <linearGradient id="logicHumanGradient" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#59e2d5"/>
          <stop offset="50%" stop-color="#8b7dff"/>
          <stop offset="100%" stop-color="#ff9464"/>
        </linearGradient>
      </defs>
      <rect x="1" y="1" width="758" height="518" rx="18" class="visual-panel"/>
      <g aria-hidden="true">
        <path d="M60 70V420 M110 70V420 M160 70V420 M210 70V420 M260 70V420
                 M60 70H260 M60 120H260 M60 170H260 M60 220H260 M60 270H260
                 M60 320H260 M60 370H260 M60 420H260" class="grid-line"/>
        <circle cx="110" cy="120" r="4" class="grid-node"/>
        <circle cx="160" cy="220" r="4" class="grid-node"/>
        <circle cx="210" cy="170" r="4" class="grid-node"/>
        <circle cx="110" cy="320" r="4" class="grid-node"/>
        <circle cx="210" cy="370" r="4" class="grid-node"/>
        <path d="M260 120L345 120L395 165L452 165
                 M260 220L330 220L388 272L450 272
                 M260 320L340 320L392 235L450 235" class="angular-path"/>
        <path d="M300 100C360 130 410 120 470 150
                 M300 350C360 320 420 345 485 305
                 M300 250C370 250 430 260 490 250" class="transition-path"/>
        <path d="M470 135C540 90 615 95 690 150
                 M470 260C550 215 620 235 695 292
                 M470 310C540 385 620 395 700 345" class="flow-halo"/>
        <path d="M450 165C530 100 615 105 700 165
                 M450 235C540 212 620 225 704 288
                 M450 272C525 350 620 398 706 346" class="curve-path"/>
        <circle cx="452" cy="165" r="7" class="visual-node logic"/>
        <circle cx="450" cy="235" r="7" class="visual-node shift"/>
        <circle cx="450" cy="272" r="7" class="visual-node shift"/>
        <circle cx="700" cy="165" r="8" class="visual-node human"/>
        <circle cx="704" cy="288" r="8" class="visual-node human"/>
        <circle cx="706" cy="346" r="8" class="visual-node human"/>
      </g>
      <text x="62" y="48" class="data-label">QUANTITATIVE STRUCTURE</text>
      <text x="290" y="455" class="data-label">MODELLING → INTERPRETATION → POLICY</text>
      <text x="520" y="48" class="data-label">NORMATIVE / HUMAN</text>
    </svg>
