<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 760" role="img" aria-labelledby="svg-title svg-description">
<title id="svg-title">Measurement &amp; Modelling ↕ Normative Judgement</title>
<desc id="svg-description">A precise quantitative grid contrasts with a fluid river landscape and three softly drawn human figures representing shared judgement. Vertical two-way arrows and counter-rotating circular animations show the reciprocal influence of modelling and norms.</desc>
<defs>
  <radialGradient id="ground" cx="50%" cy="47%" r="64%"><stop stop-color="#162b36"/><stop offset=".67" stop-color="#0d1b29"/><stop offset="1" stop-color="#06111b"/></radialGradient>
  <radialGradient id="teal-glow"><stop stop-color="#52ddcc" stop-opacity=".14"/><stop offset="1" stop-color="#52ddcc" stop-opacity="0"/></radialGradient>
  <radialGradient id="warm-glow"><stop stop-color="#ffad79" stop-opacity=".19"/><stop offset="1" stop-color="#ffad79" stop-opacity="0"/></radialGradient>
  <linearGradient id="ring-colors" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#64e1d3"/><stop offset=".47" stop-color="#aaa2ff"/><stop offset="1" stop-color="#ffad79"/></linearGradient>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#354b63"/><stop offset=".65" stop-color="#9b7c88"/><stop offset="1" stop-color="#efad79"/></linearGradient>
  <linearGradient id="river" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c0d0c3"/><stop offset=".55" stop-color="#609eb0"/><stop offset="1" stop-color="#3f7183"/></linearGradient>
  <linearGradient id="grid-fill" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#173b45" stop-opacity=".75"/><stop offset="1" stop-color="#10202c" stop-opacity=".55"/></linearGradient>
  <clipPath id="land-window"><ellipse cx="548" cy="385" rx="124" ry="171"/></clipPath>
  <clipPath id="grid-window"><ellipse cx="213" cy="385" rx="125" ry="171"/></clipPath>
      <path id="cw-path" d="M380 67 A313 313 0 1 1 380 693 A313 313 0 1 1 380 67"/>
  <path id="ccw-path" d="M380 98 A282 282 0 1 0 380 662 A282 282 0 1 0 380 98"/>
</defs>
<style>
  .diagram-font {font-family:"Nunito Sans","Trebuchet MS",Arial,sans-serif}
  .label {font-family:"Nunito Sans","Trebuchet MS",Arial,sans-serif;fill:#eff8f8;font-weight:750;font-size:18px;letter-spacing:.2px}
  .mini {font-family:"Nunito Sans","Trebuchet MS",Arial,sans-serif;fill:#cadce0;font-weight:700;font-size:17px;letter-spacing:.1px}
  .orbit-cw {fill:none;stroke:#62dace;stroke-width:2.5;stroke-dasharray:5 15;stroke-opacity:.76;animation:move-cw 11s linear infinite}
  .orbit-ccw {fill:none;stroke:#ffae88;stroke-width:2.5;stroke-dasharray:5 15;stroke-opacity:.64;animation:move-ccw 11s linear infinite}
  .center-label {font-family:"Nunito Sans","Trebuchet MS",Arial,sans-serif;fill:#f4fafa;font-weight:750;font-size:29px;text-anchor:middle;paint-order:stroke;stroke:#122430;stroke-width:.6px}
  .center-norm {fill:#ffc5a8}
  .center-arrow {font-family:"Trebuchet MS",Arial,sans-serif;fill:#b7eee7;font-weight:700;font-size:36px;text-anchor:middle}
  @keyframes move-cw {to {stroke-dashoffset:-240}}
  @keyframes move-ccw {to {stroke-dashoffset:240}}
  @keyframes brighten {0%,100%{opacity:.8}50%{opacity:1}}
  .glow-cycle {animation:brighten 6s ease-in-out infinite}
  @media (prefers-reduced-motion:reduce){.orbit-cw,.orbit-ccw,.glow-cycle{animation:none}animateMotion{display:none}}
</style>
<!-- Transparent exterior; the circular motif sits naturally against the dark website. -->
<circle cx="380" cy="380" r="350" fill="url(#ground)" stroke="#294652" stroke-width="1.4"/>
<circle cx="216" cy="379" r="213" fill="url(#teal-glow)"/>
<circle cx="548" cy="379" r="213" fill="url(#warm-glow)"/>
<circle cx="380" cy="380" r="313" fill="none" stroke="url(#ring-colors)" stroke-width="1.5" opacity=".46"/>
<circle cx="380" cy="380" r="281" fill="none" stroke="#a39ec8" stroke-width="1.2" opacity=".25"/>
<!-- Opposing motion in two concentric orbits: not a single one-way process. -->
<use href="#cw-path" class="orbit-cw"/>
<use href="#ccw-path" class="orbit-ccw"/>
<circle r="6" fill="#c8fff5" stroke="#50d9cf" stroke-width="2"><animateMotion dur="16s" repeatCount="indefinite"><mpath href="#cw-path"/></animateMotion></circle>
<circle r="6" fill="#ffe1c6" stroke="#ffaa7a" stroke-width="2"><animateMotion dur="17s" repeatCount="indefinite"><mpath href="#ccw-path"/></animateMotion></circle>
<!-- Formal quantitative structure: gridded field, cells, network and selected observations. -->
<g clip-path="url(#grid-window)">
 <rect x="78" y="205" width="269" height="355" fill="url(#grid-fill)"/>
 <path d="M108 220V552 M140 220V552 M172 220V552 M204 220V552 M236 220V552 M268 220V552 M300 220V552 M332 220V552 M81 248H347 M81 280H347 M81 312H347 M81 344H347 M81 376H347 M81 408H347 M81 440H347 M81 472H347 M81 504H347 M81 536H347" stroke="#5edacb" stroke-width="1.05" stroke-opacity=".36"/>
 <g fill="#5fe0d6" opacity=".34"><rect x="141" y="249" width="30" height="30"/><rect x="205" y="313" width="30" height="30"/><rect x="173" y="377" width="30" height="30"/><rect x="237" y="441" width="30" height="30"/><rect x="109" y="409" width="30" height="30"/></g>
 <path d="M108 445L172 381L204 415L236 338L300 307" stroke="#a3fff2" stroke-width="3.2" stroke-linejoin="round" fill="none"/>
 <path d="M141 281L204 346L270 313L300 411" stroke="#b6a9ff" stroke-opacity=".75" stroke-width="2.2" fill="none"/>
 <g fill="#dcfffa"><circle cx="108" cy="445" r="5"/><circle cx="172" cy="381" r="5"/><circle cx="204" cy="415" r="5"/><circle cx="236" cy="338" r="5"/><circle cx="300" cy="307" r="5"/></g>
 <g fill="#b5a9ff"><circle cx="141" cy="281" r="4"/><circle cx="204" cy="346" r="4"/><circle cx="270" cy="313" r="4"/><circle cx="300" cy="411" r="4"/></g>
</g>
<ellipse cx="213" cy="385" rx="125" ry="171" fill="none" stroke="#78ded7" stroke-width="1.7" opacity=".68"/>
<!-- Flowing, grounded terrain: winding water, topographic folds, quiet traces of habitation. -->
<g clip-path="url(#land-window)">
  <rect x="420" y="199" width="260" height="376" fill="url(#sky)"/>
  <circle cx="598" cy="290" r="36" fill="#ffdeb0" opacity=".80"/>
  <circle cx="598" cy="290" r="65" fill="#ffc5a2" opacity=".14"/>
  <path d="M410 426 C458 388 473 362 513 373 C553 330 568 341 599 354 C630 356 655 391 690 416 L690 572 L410 572Z" fill="#566b78" opacity=".9"/>
  <path d="M406 459 C456 417 479 412 516 432 C557 392 590 402 624 423 C654 426 673 449 699 466 L699 573 L406 573Z" fill="#668476"/>
  <path d="M403 496 C455 468 485 443 524 459 C564 447 595 462 625 476 C658 471 671 475 700 497 L700 579 L403 579Z" fill="#476f68"/>
  <path d="M408 525 C456 493 490 501 519 512 C561 496 587 508 623 526 C653 516 678 533 692 539 L692 576 L408 576Z" fill="#355d60"/>
  <!-- River: organic counterpart to the abstract gridded traces. -->
  <path d="M458 441 C484 458 522 448 537 471 S523 504 541 527 S578 550 618 582" stroke="#82b4c2" stroke-width="30" fill="none" stroke-linecap="round" opacity=".82"/>
  <path d="M458 441 C484 458 522 448 537 471 S523 504 541 527 S578 550 618 582" stroke="url(#river)" stroke-width="19" fill="none" stroke-linecap="round" opacity=".9"/>
  <!-- Abstract communal tapestry: three human presences woven together.
       Soft, abstract human forms evoke community without a literal cultural symbol.
       The hills and river remain as an uncluttered natural backdrop. -->
  <g opacity=".96" stroke-linecap="round" stroke-linejoin="round">
    <!-- Head-like circles and soft, continuous bodies: people without pictograms. -->
    <circle cx="572" cy="421" r="6.2" fill="#ffe8c9" stroke="#764f53" stroke-width="1.1"/>
    <circle cx="604" cy="415" r="6.8" fill="#ffd3ae" stroke="#764f53" stroke-width="1.1"/>
    <circle cx="634" cy="425" r="6.1" fill="#fbd4be" stroke="#764f53" stroke-width="1.1"/>
    <path d="M568 433 Q554 451 569 464 Q581 469 588 455"
          fill="none" stroke="#ffe1bb" stroke-width="5"/>
    <path d="M602 429 Q590 447 602 460 Q613 471 621 451"
          fill="none" stroke="#ffd1b2" stroke-width="5.6"/>
    <path d="M637 436 Q649 451 640 463 Q633 470 625 458"
          fill="none" stroke="#ead4ce" stroke-width="4.8"/>
    <!-- Dots at the overlaps suggest decisions emerging from collective exchange. -->
    <circle cx="590" cy="446" r="3.2" fill="#ffedc8"/>
    <circle cx="621" cy="447" r="3.2" fill="#ffedc8"/>
  </g>
</g>
<ellipse cx="548" cy="385" rx="124" ry="171" fill="none" stroke="#ffc3a1" stroke-width="1.7" opacity=".72"/>
<!-- The models/norms dialogue occupies the common middle ground. -->
<circle cx="380" cy="380" r="148" fill="#0a1924" fill-opacity=".97" stroke="#425f68" stroke-width="2"/>
<circle cx="380" cy="380" r="139" fill="none" stroke="url(#ring-colors)" stroke-width="2.4" opacity=".9"/>
<text class="center-label" x="380" y="316">Measurement &amp;</text>
<text class="center-label" x="380" y="352">Modelling</text>
<!-- Two explicit vertical feedback directions: up and down. -->
<g fill="none" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round">
  <path d="M365 416V374 M354 385L365 374L376 385" stroke="#78e9dd"/>
  <path d="M395 374V416 M384 405L395 416L406 405" stroke="#ffc39e"/>
</g>
<text class="center-label center-norm" x="380" y="453">Normative</text>
<text class="center-label center-norm" x="380" y="488">Judgement</text>

</svg>
